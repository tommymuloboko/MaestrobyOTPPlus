spring.application.name=fuelorder-api
spring.datasource.url=jdbc:h2:mem:maestro;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
# Migrations only run under the "postgres" profile; the default in-memory H2 profile builds its schema from the entities.
spring.flyway.enabled=false
server.port=8085
# Bulk Excel imports are capped at 2 MB (and 500 rows); the importer re-checks this.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
