# Run with: .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=postgres"  (after `docker compose up -d postgres`)
spring.datasource.url=${MAESTRO_DB_URL:jdbc:postgresql://localhost:5434/maestro}
spring.datasource.username=${MAESTRO_DB_USER:maestro}
spring.datasource.password=${MAESTRO_DB_PASSWORD:maestro_dev}
# The schema belongs to Flyway; Hibernate only checks that the entities still match it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
